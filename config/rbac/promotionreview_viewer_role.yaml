# This rule is not used by the project promoloupe itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to promoloupe.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: promoloupe
    app.kubernetes.io/managed-by: kustomize
  name: promotionreview-viewer-role
rules:
- apiGroups:
  - promoloupe.com
  resources:
  - promotionreviews
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - promoloupe.com
  resources:
  - promotionreviews/status
  verbs:
  - get
