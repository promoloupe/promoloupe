---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - promoloupe.com
  resources:
  - promotionpolicies
  - promotionreviews
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - promoloupe.com
  resources:
  - promotionpolicies/finalizers
  - promotionreviews/finalizers
  verbs:
  - update
- apiGroups:
  - promoloupe.com
  resources:
  - promotionpolicies/status
  - promotionreviews/status
  verbs:
  - get
  - patch
  - update
