# This rule is not used by the project promoloupe itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the promoloupe.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: promoloupe
    app.kubernetes.io/managed-by: kustomize
  name: promotionreview-editor-role
rules:
- apiGroups:
  - promoloupe.com
  resources:
  - promotionreviews
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - promoloupe.com
  resources:
  - promotionreviews/status
  verbs:
  - get
