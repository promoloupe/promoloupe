version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - depguard
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - modernize
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - logcheck
    - kubeapilinter
  settings:
    custom:
      logcheck:
        type: "module"
        description: Checks Go logging calls for Kubernetes logging conventions.
      kubeapilinter:
        type: "module"
        description: Checks API types against the Kubernetes API conventions.
        settings:
          linters:
            disable:
              # Meant for in-tree types validated in Go, not for CRDs,
              # where OpenAPI validates optionality.
              - nonpointerstructs
          lintersConfig:
            conditions:
              # Custom resources do not support strategic merge patch or protobuf.
              usePatchStrategy: Forbid
              useProtobuf: Forbid
            optionalfields:
              pointers:
                # Optional structs use omitzero instead of a pointer when their
                # zero value is invalid, for example with MinProperties=1.
                preference: WhenRequired
            defaults:
              # Kubebuilder's documented marker, used across the scaffold.
              preferredDefaultMarker: kubebuilder:default
    depguard:
      rules:
        forbid-sort-pkg:
          deny:
            - pkg: sort
              desc: Should be replaced with slices package
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
    modernize:
      disable:
        - omitzero
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
      - linters:
          - kubeapilinter
        path-except: api/*
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
