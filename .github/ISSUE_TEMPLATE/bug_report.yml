name: Bug report
description: Something does not work as documented.
labels: ["kind/bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. For security issues, do not use this form: follow [SECURITY.md](https://github.com/promoloupe/promoloupe/blob/main/SECURITY.md) instead.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - controller
        - reviewer
        - CLI
        - Helm chart
        - documentation
        - not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the PromotionPolicy or PromotionReview involved if relevant (remove any secrets).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: promoloupe version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Kubernetes or OpenShift version, GitLab version (SaaS or self-managed), Argo CD version.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
